# Separate workspace: TLS fixtures must not add networking or crypto providers
# to Casita's default/portable tests, or mask its downstream version constraints.
[package]
name = "casita-tls-connector-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dev-dependencies]
casita = { path = "../../crates/casita", default-features = false, features = ["s3"] }
aws-sdk-s3 = { version = "=1.144.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-aws-lc"] }
object_store = { version = "0.14", features = ["aws"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
